<!DOCTYPE html>
<html lang="en">
<head>
   
</head>
<body>
<table  cellspacing="10" cellpadding="10" width="900" align="center" style="background-color: lightgoldenrodyellow;">

    <form>
    <tr>
        <th colspan="2" style="font-size: xx-large;align-self: center;">Student registration form</th>
    </tr>    
    <tr>
        <td><b>Roll no:</b></td>
        <td>
            <input type="number" style="width: 650px"  placeholder="Roll no" name="RollNumber">
        </td>
    </tr>
    <tr>
        <td><b>Student name:</b></td>
        <td>
            <input type="text" style="width: 320px" placeholder="First name" name="First name">
    
            <input type="text" style="width: 320px" placeholder="Last name" name="Last name">
        </td>
        
    </tr>
    <tr>
        <td><b>Father's name:</b></td>
        <td>
            <input type="text" style="width: 650px" placeholder="Father name" name="Father name">
        </td>
     </tr>   
    <tr>
        <td><b>Date of birth</b></td>
             <td><input type="number" style="width: 210px" placeholder="Day" name="number">-
                 <input type="number" style="width: 210px" placeholder="Month"name="number">-
                 <input type="number" style="width: 210px" placeholder="Year" name="number">
            </td>
    </tr>
    <tr>
        <td><b>Mobile no:</b></td>
        <td>+91
            <input type="number" style="width: 620px" placeholder="number" name="number">
        </td>
    </tr>
    <tr>
        <td><b>email id:</b></td>
        <td>
            <input type="email" style="width: 650px" placeholder="email id" name="email">
        </td>
    </tr>
    <tr>
        <td><b>Password:</b></td>
        <td>
            <input type="password" style="width: 650px" placeholder="enter password">
        </td>
    </tr>
    <tr>
        <td><b>Gender:</b></td>
        <td>
            <input type="radio" style="width: 50px" name="gender" value="Male" checked>
            <label>Male</label>
             <input type="radio" style="width: 50px" name="gender" value="Female">
            <label>Female</label>
             <input type="radio" style="width: 50px" name="gender" value="Others">
            <label>Others</label>
        </td>
    </tr>    
    <tr>
        <td><b>Department:</b></td>
        <td>
            <input type="checkbox" style="width: 50px" name="Department" value="CSE" checked>
            <label>CSE</label>
             <input type="checkbox" style="width: 50px" name="Department" value="IT">
            <label>IT</label>
             <input type="checkbox" style="width: 50px" name="Department" value="ECE">
            <label>ECE</label>
             <input type="checkbox" style="width: 50px" name="Department" value="Civil">
            <label>Civil</label>
             <input type="checkbox" style="width: 50px" name="Department" value="Mech">
            <label>Mech</label>
        </td>
    </tr> 
    <tr>
        <td><b>course</b></td>
        <td>
            <select name="course" style="width: 650px" >
                <option disabled selected align="center">--------------------Select Current Course's--------------------</option>
                <optgroup label="FROUNT END">
                <option>HTML</option>
                <option>CSS</option>
                <option>REACT</option>
                </optgroup>
                <optgroup label="BACK END">
                <option>PYTHON</option>
                <option>JAVA</option>
                <option>.NET</option>
                </optgroup>
            </select>
        </td>
    </tr>
    <tr>
        <td><b>Student photo</b></td>
        <td>
            <input type="file" style="width: 500px" placeholder="choose file">
        </td>
    </tr>
    <tr>
        <td><b>City:</b></td>
        <td>
            <input type="text" style="width: 650px" placeholder="City name" name="name">
        </td>
    </tr>
    <tr>
        <td><b>Address</b></td>
        <td>
            <textarea style="width: 650px" placeholder="Address" name="address" col="30" rows="5"></textarea>
        </td>
    </tr>
    <tr>
    
        <td align="center" colspan="2">
            <input type="submit" placeholder="Register" value="Register">
        </td>

    </tr>
    </form>

</table>
    
</body>
</html>
